<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
<title id="title">Publication Pipeline</title><desc id="desc">Canonical Markdown and publication profiles flow through a governed build into books, briefs, presentations, review packages and a website with provenance and checksums.</desc>
